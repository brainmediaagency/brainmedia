# Not: Birincil hosting artık Vercel (vercel.json + GitHub).
# Bu dosya yalnızca eski Netlify referansı içindir.

[build]
  command = "npm run build"
  publish = "dist"

# Vite, VITE_* değişkenlerini build anında bundle’a gömer.
# Vercel → Project → Environment Variables (tercih edilen yol).
# Eski Netlify yolu: Site configuration → Environment variables
# (localhost .env yetmez; remote build ayrı ortamdır):
#
# Firebase
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_APPCHECK_SITE_KEY  (opsiyonel)
#
# OneSignal (yalnızca App ID — REST key Apps Script’te)
#   VITE_ONESIGNAL_APP_ID
#
# Google Sheets / Drive webhook (Excel + Drive + pushNotify)
#   VITE_SHEETS_WEBHOOK_URL=https://script.google.com/macros/s/XXXX/exec
#   (VITE_SHEETS_WEBHOOK_SECRET kaldırıldı — Apps Script Firebase idToken doğrular)
#
# Excel embed sekmesi (koordinatör / yönetim)
#   VITE_GOOGLE_SHEETS_ID
#   VITE_GOOGLE_SHEETS_EMBED_URL  (opsiyonel)
#
# Sonra: Deploys → Trigger deploy → Clear cache and deploy site.
# URL değişince mutlaka yeniden build gerekir.
# Eski VITE_SHEETS_WEBHOOK_SECRET varsa Netlify’dan silin.

# Mirror Firebase Hosting security headers (see firebase.json).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.gstatic.com/firebasejs/ https://apis.google.com https://cdn.onesignal.com https://onesignal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdn.onesignal.com https://*.onesignal.com https://onesignal.com https://api.onesignal.com https://script.google.com https://script.googleusercontent.com; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/ https://docs.google.com https://sheets.google.com; worker-src 'self' https://cdn.onesignal.com blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
